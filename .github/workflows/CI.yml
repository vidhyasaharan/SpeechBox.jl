name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
permissions:
  actions: write
  contents: read
env:
  JULIA_PKG_USE_CLI_GIT: 'true' # use the runner's git (not libgit2) so the [sources] url for TimeFrequencyAnalysis resolves reliably
jobs:
  test:
    # Minimum supported Julia and latest stable on Linux; latest stable on macOS and
    # Windows. Each runner tests its native architecture (x64 on ubuntu/windows-latest,
    # aarch64 on macos-latest) - setup-julia defaults to the runner's architecture.
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12' # minimum supported version (see [compat] julia in Project.toml)
          - '1'    # latest stable release
        os:
          - ubuntu-latest
        include:
          - version: '1'
            os: macos-latest
          - version: '1'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
