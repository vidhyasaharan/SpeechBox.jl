name: Documentation
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write
env:
  JULIA_PKG_USE_CLI_GIT: 'true' # the docs environment resolves TimeFrequencyAnalysis from its GitHub url via [sources]
jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate git access to the private TimeFrequencyAnalysis repo
        # The docs environment resolves TimeFrequencyAnalysis from its GitHub url via
        # [sources]; see the matching step in CI.yml. Skipped when the secret is not set.
        shell: bash
        env:
          TFA_READ_TOKEN: ${{ secrets.TFA_READ_TOKEN }}
        run: |
          if [ -n "$TFA_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${TFA_READ_TOKEN}@github.com/unsw-edu-au/TimeFrequencyAnalysis.jl".insteadOf "https://github.com/unsw-edu-au/TimeFrequencyAnalysis.jl"
          fi
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy docs
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
